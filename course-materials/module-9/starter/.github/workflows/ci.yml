name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff pytest mypy

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --strict invoice_calc.py

      - name: Tests
        run: pytest test_invoice_calc.py