[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "report-svc"
version = "0.1.0"
description = "A configuration-safe reporting service using pydantic-settings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
