[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline"
version = "0.1.0"
description = "Production-grade Ingestion & Transformation Service"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.7",
    "pydantic==2.9.2",
    "psycopg[binary]==3.2.3",
]

[project.scripts]
pipeline = "pipeline.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
exclude = [
    "course-materials",
    ".venv",
    "build",
    "dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [
    "course-materials",
    ".venv",
    "build",
    "dist",
]